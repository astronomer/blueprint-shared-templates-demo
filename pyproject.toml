[project]
name = "blueprint-shared-templates-demo"
version = "0.1.0"
description = "Blueprint shared templates demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "airflow-blueprint==0.5.0",
]

[project.entry-points."airflow_blueprint.blueprints"]
shared_templates = "shared_templates"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared_templates"
