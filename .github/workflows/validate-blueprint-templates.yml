name: Validate Blueprint Templates

on:
  pull_request:
    paths:
      - "src/shared_templates/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-blueprint-templates.yml"
  push:
    branches:
      - main
    paths:
      - "src/shared_templates/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-blueprint-templates.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install project
        run: uv sync --locked

      - name: Validate Blueprint discovery
        run: uv run blueprint list

      - name: Validate package build
        run: uv build
